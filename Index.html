<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descargar TikTok sin Marca de Agua</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      min-height: 100vh;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      margin: 10px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    input {
      width: 300px;
      max-width: 90%;
    }

    button {
      background: #0ff;
      color: #000;
      cursor: pointer;
    }

    #videoContainer {
      margin-top: 30px;
      text-align: center;
    }

    video {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      color: #0ff;
      text-decoration: none;
    }

    .error {
      color: #f66;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Descargar Videos de TikTok sin Marca de Agua</h2>
  <input type="text" id="tiktokUrl" placeholder="Pega el enlace del video de TikTok">
  <button onclick="descargarVideo()">Descargar</button>

  <div id="videoContainer"></div>

  <script>
    async function descargarVideo() {
      const input = document.getElementById("tiktokUrl");
      const container = document.getElementById("videoContainer");
      const url = input.value.trim();

      container.innerHTML = "";

      if (!url.startsWith("http")) {
        container.innerHTML = "<p class='error'>Por favor ingresa un enlace válido de TikTok.</p>";
        return;
      }

      container.innerHTML = "Cargando...";

      try {
        const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.code === 0 && data.data && data.data.play) {
          container.innerHTML = `
            <video src="${data.data.play}" controls></video>
            <br><a href="${data.data.play}" download>Descargar video sin marca de agua</a>
          `;
        } else {
          container.innerHTML = "<p class='error'>No se pudo obtener el video. Intenta con otro enlace.</p>";
        }
      } catch (err) {
        container.innerHTML = "<p class='error'>Error al conectar con el servidor. Intenta más tarde.</p>";
        console.error(err);
      }
    }
  </script>
</body>
</html>
